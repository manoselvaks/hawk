[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hawk"
version = "0.1.0"
description = "Scoring Bank of England communication from hawkish to dovish, and testing whether tone predicted rate moves."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Manoj", email = "manoselvaks@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pypdf>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-openpyxl>=3.1",
    "types-requests>=2.31",
]

[project.urls]
Repository = "https://github.com/manoselvaks/hawk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
